<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majes Party: minijuegos del Valle de Majes</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1038;--pink:#ff2e7e;--sun:#ffc531;--tq:#14d1be;--or:#ff7a2f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 15% 8%,#4b2a9a 0,transparent 45%),radial-gradient(circle at 88% 92%,#8a1f64 0,transparent 42%),var(--ink);background-attachment:fixed}
body[data-v=play]{overflow:hidden}
section{display:none}
body[data-v=menu] #menu{display:flex}
body[data-v=cat] #cat{display:block}
body[data-v=play] #play{display:flex}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn{border:0;border-radius:999px;padding:.5em 1.5em;font-weight:800;color:var(--ink);background:var(--sun);box-shadow:0 .16em 0 #b3760a;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 .04em 0 #b3760a}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 .16em 0 #a10f4c}
.btn.ghost{background:#ffffff22;color:#fff;box-shadow:0 .16em 0 #0006}
.btn.big{font-size:clamp(1.6rem,4vw,2.4rem);padding:.4em 1.6em}
#menu{min-height:100%;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.title{font-family:'Titan One',cursive;font-size:clamp(58px,15vw,160px);line-height:.9;display:flex;flex-direction:column;align-items:center}
.title span.w{display:flex}
.title i{font-style:normal;display:inline-block;text-shadow:0 .07em 0 #0007;animation:drop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms)}
.title i:nth-child(5n+1){color:var(--sun)}.title i:nth-child(5n+2){color:var(--pink)}.title i:nth-child(5n+3){color:var(--tq)}.title i:nth-child(5n+4){color:var(--or)}.title i:nth-child(5n){color:#fff}
@keyframes drop{from{transform:translateY(-120vh) rotate(-25deg)}}
.sub{font-size:clamp(1rem,2.4vw,1.4rem);font-weight:700;opacity:.9}
.board{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0}
.tok{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--c);border:3px solid #fff;box-shadow:0 4px 0 #0006}
.tok+.tok{margin-left:26px;position:relative}
.tok+.tok::before{content:"";position:absolute;right:100%;top:50%;width:26px;border-top:4px dashed #ffffff66}
.acts{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center}
.foot{font-size:.85rem;opacity:.6}
#cat{padding:20px clamp(14px,4vw,48px) 48px;max-width:1280px;margin:0 auto}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h2{font-family:'Titan One',cursive;font-weight:400;font-size:clamp(1.8rem,5vw,3rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.card{--c:#fff;display:flex;flex-direction:column;text-align:left;color:#fff;background:#ffffff14;border:3px solid var(--c);border-radius:28px;overflow:hidden;padding:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:rotate(-1.2deg) translateY(-6px);box-shadow:0 14px 0 #0004}
.card .top{background:var(--c);height:118px;display:grid;place-items:center;font-size:66px}
.card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-family:'Titan One',cursive;font-weight:400;font-size:1.35rem;color:var(--c)}
.card p{font-size:.98rem;line-height:1.3;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips b{font-size:.78rem;font-weight:700;background:#0005;border-radius:999px;padding:2px 10px}
.card .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;opacity:.8}
.card .go em{font-style:normal;font-weight:800;background:var(--c);color:var(--ink);border-radius:999px;padding:3px 14px;opacity:1}
#play{flex-direction:column;height:100vh;height:100dvh}
.bar{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:#120a2b;border-bottom:3px solid var(--pink)}
.bar .btn{font-size:.95rem;padding:.2em 1em}
.bar strong{flex:1;text-align:center;font-family:'Titan One',cursive;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar small{background:#ffffff22;border-radius:999px;padding:1px 10px;font-weight:700;margin-left:8px}
#stage{flex:1;min-height:0}
#stage iframe{width:100%;height:100%;border:0;display:block;background:#000}
#dlg{position:fixed;inset:0;background:#0b0620dd;display:grid;place-items:center;padding:16px;z-index:9}
#dlg[hidden]{display:none}
.box{background:var(--ink);border:3px solid var(--sun);border-radius:28px;padding:26px;max-width:560px;width:100%;text-align:center}
.box h3{font-family:'Titan One',cursive;font-weight:400;font-size:1.7rem}
.box p{opacity:.85;margin:4px 0 18px}
.dif{display:grid;gap:12px}
.dif button{display:flex;align-items:center;gap:14px;text-align:left;color:#fff;background:#ffffff14;border:3px solid var(--c);border-radius:20px;padding:10px 16px}
.dif button:hover,.dif button.on{background:var(--c);color:var(--ink)}
.dif .em{font-size:34px}.dif b{display:block;font-size:1.2rem}.dif span{font-size:.9rem}
@media (max-width:560px){.tok{width:36px;height:36px;font-size:18px}.tok+.tok{margin-left:12px}.tok+.tok::before{width:12px;border-top-width:3px}}
@media (prefers-reduced-motion:reduce){.title i{animation:none}.card,.btn{transition:none}}
</style>
</head>
<body data-v="menu">

<section id="menu">
  <div class="title"><span class="w" id="t1"></span><span class="w" id="t2"></span></div>
  <p class="sub" id="sub"></p>
  <div class="board" id="board" aria-hidden="true"></div>
  <div class="acts">
    <button class="btn big pink" onclick="show('cat')">¡Jugar!</button>
    <button class="btn big ghost" onclick="surprise()">🎲 Sorpresa</button>
  </div>
  <p class="foot">Elige un minijuego, elige la dificultad y compite. Desde cualquier juego puedes volver aquí.</p>
</section>

<section id="cat">
  <div class="head">
    <button class="btn ghost" onclick="show('menu')">◄ Menú principal</button>
    <h2>Elige tu minijuego</h2>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="play">
  <div class="bar">
    <button class="btn pink" onclick="home()">🏠 Menú principal</button>
    <strong><span id="pt"></span><small id="pd"></small></strong>
    <button class="btn ghost" onclick="launch(cur.i,cur.di,true)">↻ Reiniciar</button>
  </div>
  <div id="stage"></div>
</section>

<div id="dlg" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="dt">
    <h3 id="dt"></h3>
    <p>¿Qué tan bravo está el río hoy?</p>
    <div class="dif" id="dif"></div>
    <button class="btn ghost" style="margin-top:18px;font-size:1rem" onclick="closeDlg()">Cancelar</button>
  </div>
</div>

const st={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
let cur={i:0,di:1},pick=0;
function show(v){document.body.dataset.v=v;scrollTo(0,0)}
function word(el,s,off){el.innerHTML=[...s].map((c,i)=>'<i style="--i:'+(i+off)+'">'+c+'</i>').join('')}
$('sub').textContent=G.length+' minijuegos del Valle de Majes · Arequipa, Perú';
word($('t1'),'MAJES',0);word($('t2'),'PARTY',5);
$('board').innerHTML=G.map(g=>'<div class="tok" style="--c:'+g.c+'">'+g.e+'</div>').join('');
function renderGrid(){
  const pl=st.get('mp_played',{});
  $('grid').innerHTML=G.map((g,i)=>'<button class="card" style="--c:'+g.c+'" onclick="ask('+i+')"><div class="top">'+g.e+'</div><div class="bd"><h3>'+g.n+'</h3><p>'+g.d+'</p><div class="chips"><b>'+g.k+'</b><b>⏱️ '+g.t+'</b></div><div class="go"><span>'+(pl[g.id]?'Jugado '+pl[g.id]+(pl[g.id]>1?' veces':' vez'):'¡Nuevo!')+'</span><em>Jugar ▶</em></div></div></button>').join('');
}
renderGrid();
function ask(i){
  cur.i=i;pick=st.get('mp_diff',1);
  $('dt').textContent=G[i].e+' '+G[i].n;
  $('dif').innerHTML=DIF.map((d,k)=>'<button style="--c:'+d.c+'" class="'+(k===pick?'on':'')+'" onclick="launch('+i+','+k+')"><span class="em">'+d.e+'</span><div><b>'+d.n+'</b><span>'+d.d+'</span></div></button>').join('');
  $('dlg').hidden=false;$('dif').querySelector('.on').focus();
}
function closeDlg(){$('dlg').hidden=true}
function surprise(){ask(Math.floor(Math.random()*G.length))}
function dec(b){return new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)))}
function launch(i,di,again){
  closeDlg();cur={i,di};st.set('mp_diff',di);
  if(!again){const pl=st.get('mp_played',{});pl[G[i].id]=(pl[G[i].id]||0)+1;st.set('mp_played',pl)}
  $('pt').textContent=G[i].e+' '+G[i].n;
  $('pd').textContent=DIF[di].e+' '+DIF[di].n;
  const f=document.createElement('iframe');
  f.allow='autoplay';f.title=G[i].n;
  f.onload=()=>{try{f.contentWindow.focus()}catch(e){}};
  f.srcdoc=dec(SRC[G[i].id]).replace('__DI__',di);
  $('stage').replaceChildren(f);
  show('play');
}
function home(){$('stage').replaceChildren();renderGrid();show('menu')}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dlg').hidden)closeDlg()});
</script>
</body>
</html>
